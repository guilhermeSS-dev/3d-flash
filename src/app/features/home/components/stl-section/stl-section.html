<section id="arquivos-stl" class="products-section" aria-labelledby="stl-title" tabindex="-1">
  <div class="section-inner products-inner">
    <div class="products-heading">
      <h2 id="stl-title" class="display-heading">Arquivos <span class="accent-text">STL</span></h2>
    </div>
    <div class="products-banner-wrap">
      <a
        class="products-banner"
        [href]="config.links.stlLibrary"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acessar arquivos STL no MakerWorld (abre em nova aba)"
      >
        <img
          [src]="assets.stlBanner"
          alt="Arquivos STL e modelos para impressão 3D no MakerWorld"
          width="1254"
          height="1254"
          loading="lazy"
          decoding="async"
        />
      </a>
    </div>
  </div>
</section>
