<section
  id="curso"
  class="course-preview-section"
  aria-labelledby="course-preview-title"
  tabindex="-1"
>
  <div class="section-inner course-inner">
    <div class="course-copy" data-keychain-obstacle="course-copy">
      <p class="section-label">CURSO 3D FLASH</p>
      <h2 id="course-preview-title" class="display-heading">
        Aprenda a transformar
        <span class="accent-text">ideias em criações.</span>
      </h2>
    </div>


    <div class="course-cards" aria-label="Cursos disponíveis">
      <a
        class="course-card"
        routerLink="/curso/iniciante"
        aria-label="Conheça o curso para iniciantes"
      >
        <span class="course-card-image">
          <img
            [src]="assets.courses.beginner"
            alt="Banner do curso de impressão 3D para iniciantes"
            width="1254"
            height="1254"
            loading="lazy"
            decoding="async"
          />
        </span>
        <span class="course-card-action">
          <span>Conheça o curso</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path
              d="M4 12h15m-6-6 6 6-6 6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </a>

      <a
        class="course-card"
        routerLink="/curso/modelagem"
        aria-label="Conheça o curso de modelagem"
      >
        <span class="course-card-image">
          <img
            [src]="assets.courses.modeling"
            alt="Banner do curso de modelagem 3D"
            width="1024"
            height="1024"
            loading="lazy"
            decoding="async"
          />
        </span>
        <span class="course-card-action">
          <span>Conheça o curso</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path
              d="M4 12h15m-6-6 6 6-6 6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </a>
    </div>
  </div>
</section>
