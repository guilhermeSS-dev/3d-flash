<section id="sobre" class="about-section" aria-labelledby="about-title" tabindex="-1">
  <div class="section-inner about-inner">
    <div class="about-copy" data-keychain-obstacle="about-copy">
      <p class="section-label">SOBRE A 3D FLASH</p>
      <h2 id="about-title" class="display-heading">
        Ideias sem limites.
        <span class="accent-text">Criações reais.</span>
      </h2>
    </div>

    <div class="about-visual" data-keychain-obstacle="about-products">
      <figure class="case-display case-display--digital">
        <img
          [src]="assets.phoneCase.digital"
          alt="Capinha digital azul da 3D Flash"
          width="1024"
          height="1536"
          loading="lazy"
          decoding="async"
        />
        <div class="case-pedestal" aria-hidden="true"></div>
      </figure>

      <svg class="conversion-arrows" viewBox="0 0 70 58" fill="none" aria-hidden="true">
        <path d="m9 9 20 20L9 49M36 9l20 20-20 20" />
      </svg>

      <figure class="case-display case-display--physical">
        <img
          [src]="assets.phoneCase.physical"
          alt="Capinha física preta com detalhes amarelos da 3D Flash"
          width="1024"
          height="1536"
          loading="lazy"
          decoding="async"
        />
        <div class="case-pedestal" aria-hidden="true"></div>
      </figure>
    </div>
  </div>
</section>
