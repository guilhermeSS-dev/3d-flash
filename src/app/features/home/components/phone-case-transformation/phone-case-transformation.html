<div
  class="case-stage"
  role="img"
  aria-label="Capinha 3D Flash: modelo digital azul e versão física preta com detalhes amarelos"
>
  <img
    class="case-image case-image--digital"
    [src]="assets.phoneCase.digital"
    alt=""
    aria-hidden="true"
    width="1024"
    height="1536"
    loading="lazy"
    decoding="async"
  />
  <img
    class="case-image case-image--physical"
    [src]="assets.phoneCase.physical"
    alt=""
    aria-hidden="true"
    width="1024"
    height="1536"
    loading="lazy"
    decoding="async"
  />
</div>
