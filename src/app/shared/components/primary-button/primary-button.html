<a class="primary-button" [routerLink]="destination">
  @if (icon() === 'course') {
    <svg class="button-icon" viewBox="0 0 40 32" fill="none" aria-hidden="true" focusable="false">
      <path d="M1 10 20 2l19 8-19 8L1 10Z" fill="currentColor" />
      <path d="M8 15v10c8 6 16 6 24 0V15l-12 5-12-5Z" fill="currentColor" />
      <path d="M37 12v13" stroke="currentColor" stroke-width="2" />
    </svg>
  } @else {
    <svg class="button-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
      <path
        d="M27 18v10H4V5h10M18 4h10v10M28 4 14 18"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
  <span><ng-content /></span>
  @if (icon() === 'course') {
    <svg class="button-arrow" viewBox="0 0 30 24" fill="none" aria-hidden="true" focusable="false">
      <path
        d="M1 12h26M17 2l10 10-10 10"
        stroke="currentColor"
        stroke-width="2.3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
</a>
