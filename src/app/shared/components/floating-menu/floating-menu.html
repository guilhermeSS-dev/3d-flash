<button
  #navigationTrigger
  class="navigation-toggle"
  type="button"
  [attr.aria-label]="expanded() ? 'Fechar navegação' : 'Abrir navegação'"
  [attr.aria-expanded]="expanded()"
  aria-controls="site-navigation"
  (click)="toggle()"
>
  <img [src]="assets.menu" alt="" width="1312" height="1199" />
</button>

<nav
  id="site-navigation"
  class="navigation-panel"
  [class.navigation-panel--expanded]="expanded()"
  [attr.aria-hidden]="!expanded()"
  [attr.inert]="expanded() ? null : ''"
  aria-label="Seções desta página"
>
  <ul>
    @for (item of items; track item.id; let index = $index) {
      <li [style.--item-index]="index">
        <a
          [routerLink]="['/']"
          [fragment]="item.id"
          [tabIndex]="expanded() ? 0 : -1"
          (click)="close()"
          >{{ item.label }}</a
        >
      </li>
    }
  </ul>
</nav>
